name: Update content index
on:
  push:
    branches: [main]
    paths: ['pages/**', 'scripts/build_content.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_content.py
      - name: Save generated index
        run: |
          if ! git diff --quiet -- content-index.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add content-index.js
            git commit -m 'Update page content index'
            git push
          fi
